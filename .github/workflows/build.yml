# Builds DeskFlower on Linux and macOS, runs the tests and packages it (DEB and DMG, kept as
# artifacts of the run). A v* tag also publishes them in the release of that tag. Windows is built
# locally with scripts\build-windows.bat and scripts\package-windows.bat (the MSI is signed with
# the update key, which stays off GitHub) and uploaded to the same release by hand.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.11.2'   # the same Qt as the Windows builds

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsodium-dev libssl-dev \
            libx11-dev libxi-dev libxtst-dev libxrandr-dev libxfixes-dev libxext-dev libei-dev \
            libpipewire-0.3-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libxcb-cursor0 dpkg-dev file \
            xvfb xclip dbus

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -- -k 0   # report every error, not just the first

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: deskflower.node.debug=true
          # disposable runner: the cases that touch the desktop or the profile run too (docs/TESTING.md)
          DESKFLOWER_DESKTOP_TESTS: "1"
          DESKFLOWER_PRIVATE_SESSION: 1
        # A private session bus and an X display for the Linux integration tests (tst_portal,
        # tst_x11), which run only when DESKFLOWER_PRIVATE_SESSION says so; the others stay
        # offscreen. As in tests/docker/build-and-test.sh.
        run: >
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24"
          ctest --test-dir build --output-on-failure

      - name: Package (DEB)
        run: cd build && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: deskflower-linux-x64
          path: build/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install ninja pkg-config libsodium openssl@3

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build -- -k 0   # report every error, not just the first

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen   # tst_macclipboard sets cocoa for itself (the pasteboard)
          QT_LOGGING_RULES: deskflower.node.debug=true
          # disposable runner: the cases that touch the desktop or the profile run too (docs/TESTING.md)
          DESKFLOWER_DESKTOP_TESTS: "1"
        # Qt's OpenSSL TLS backend loads libssl at run time (the phone server needs it).
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix openssl@3)/lib"
          ctest --test-dir build --output-on-failure

      # DeskFlower.app holds every program, Qt, libsodium, libcrypto and libssl, and is signed ad hoc
      # by the installation itself (cmake/MacBundle.cmake). Checked here as a clean Mac would run it:
      # nothing may come from Homebrew or the Qt used to build.
      - name: Check the bundle
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/stage"
          app="$RUNNER_TEMP/stage/DeskFlower.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bad=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              if otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)|/Qt/[0-9]'; then
                echo "::error::$f uses libraries outside the bundle"; bad=1
              fi
            fi
          done < <(find "$app" -type f -print0)
          test "$bad" = 0
          # What actually loads (dyld), with Homebrew's OpenSSL out of the way.
          loaded=$(env -u DYLD_FALLBACK_LIBRARY_PATH DYLD_PRINT_LIBRARIES=1             "$app/Contents/MacOS/deskflower-service" --version 2>&1)
          echo "$loaded" | grep -E '/opt/homebrew|/Qt/[0-9]' && { echo "::error::the service loads outside libraries"; exit 1; }
          loaded=$(DYLD_PRINT_LIBRARIES=1 perl -e 'alarm 60; exec @ARGV'             "$app/Contents/Helpers/deskflower-session.app/Contents/MacOS/deskflower-session" --help 2>&1)
          echo "$loaded" | grep -E '/opt/homebrew|/Qt/[0-9]' && { echo "::error::the helper loads outside libraries"; exit 1; }
          echo "$loaded" | grep -q 'libqcocoa' || { echo "::error::the helper found no Qt platform plugin"; echo "$loaded"; exit 1; }
          test -f "$app/Contents/Frameworks/libssl.3.dylib"

      - name: Package (DMG)
        run: cd build && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: deskflower-macos-arm64
          path: build/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "DeskFlower ${TAG#v}" --generate-notes
          gh release upload "$TAG" packages/* --clobber
